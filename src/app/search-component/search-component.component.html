<div [ngClass]="isToggled() ? 'new-main' : 'main'">
    <form [formGroup]="searchForm">
        <input type="text" placeholder="Search..." formControlName="search" />
    </form>

    <ul>
        @for(city of filteredCities(); track city){
            <li>{{city}}</li>
        }
    </ul>
</div>

<div class="btn-container">
    <button (click)="onToggle()">Toggle Color</button>
</div>
